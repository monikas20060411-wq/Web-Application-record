<!DOCTYPE html>
<html>
<head>
    <title>Travel World</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #e0f7fa;
        }

        header {
            background-color: #00838f;
            color: white;
            text-align: center;
            padding: 40px;
        }

        header h1 {
            font-size: 42px;
            font-family: Georgia, serif;
        }

        .places {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 40px;
        }

        .place {
            background-color: white;
            width: 280px;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 0 10px #aaa;
        }

        .place h2 {
            color: #00838f;
        }

        .place a {
            color: #00838f;
            font-weight: bold;
            text-decoration: none;
        }

        footer {
            background-color: #006064;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Travel World</h1>
        <p>Explore Beautiful Places</p>
    </header>

    <div class="places">

        <div class="place">
            <h2>Paris</h2>
            <p>Discover the beautiful city of Paris.</p>
            <a href="#">Explore</a>
        </div>

        <div class="place">
            <h2>London</h2>
            <p>Visit the historic city of London.</p>
            <a href="#">Explore</a>
        </div>

        <div class="place">
            <h2>Tokyo</h2>
            <p>Experience modern Tokyo.</p>
            <a href="#">Explore</a>
        </div>

    </div>

    <footer>
        <p>© 2026 Travel World</p>
    </footer>

</body>
</html>
