<!DOCTYPE html>
<html>
<head>
    <title>Online Learning</title>

    <style>
        body {
            margin: 0;
            font-family: Verdana, sans-serif;
            background-color: #f5f5f5;
        }

        header {
            background-color: #4caf50;
            color: white;
            text-align: center;
            padding: 30px;
        }

        nav {
            background-color: #333;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 30px;
        }

        .course {
            background-color: white;
            padding: 20px;
            flex: 1;
            border-radius: 10px;
            box-shadow: 0 0 8px #bbb;
        }

        .course h2 {
            color: #4caf50;
        }
    </style>
</head>

<body>

    <header>
        <h1>Online Learning Center</h1>
        <p>Learn Something New Every Day</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Courses</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">

        <div class="course">
            <h2>HTML</h2>
            <p>Learn how to create web pages using HTML.</p>
        </div>

        <div class="course">
            <h2>CSS</h2>
            <p>Learn how to style websites using CSS.</p>
        </div>

        <div class="course">
            <h2>JavaScript</h2>
            <p>Learn how to make websites interactive.</p>
        </div>

    </div>

</body>
</html>
