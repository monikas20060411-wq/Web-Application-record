<!DOCTYPE html>
<html>
<head>
    <title>Personal Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e3f2fd;
            text-align: center;
            margin: 0;
        }

        .profile {
            background-color: white;
            width: 500px;
            margin: 60px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px gray;
        }

        h1 {
            color: #1565c0;
            font-family: Georgia, serif;
        }

        p {
            color: #555;
            font-size: 18px;
            line-height: 1.6;
        }

        .button {
            background-color: #1565c0;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="profile">
        <h1>My Profile</h1>
        <h2>John Smith</h2>

        <p>
            I am a student interested in
            <b>Web Development</b> and
            <i>Computer Technology</i>.
        </p>

        <a href="#" class="button">Contact Me</a>
    </div>

</body>
</html>
